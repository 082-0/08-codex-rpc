name: Build desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-latest
            platform: mac
            arch: universal
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Linux launcher
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sh -n scripts/run-linux.sh
          temp_dir=$(mktemp -d)
          cp scripts/run-linux.sh "$temp_dir/08-Codex-RPC"
          chmod +x "$temp_dir/08-Codex-RPC"
          arch=$(uname -m)
          if [ "$arch" = aarch64 ]; then arch=arm64; fi
          printf '#!/bin/sh\nprintf "%%s" "$1"\n' > "$temp_dir/test-linux-${arch}.AppImage"
          chmod +x "$temp_dir/test-linux-${arch}.AppImage"
          test "$("$temp_dir/08-Codex-RPC" probe)" = probe
      - name: Build native package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Bundle Linux architectures
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p linux-package
          cp "artifacts/08-Codex-RPC-${version}-linux-x86_64.AppImage" linux-package/
          cp "artifacts/08-Codex-RPC-${version}-linux-arm64.AppImage" linux-package/
          cp scripts/run-linux.sh linux-package/08-Codex-RPC
          chmod +x linux-package/08-Codex-RPC linux-package/*.AppImage
          tar -czf "artifacts/08-Codex-RPC-${version}-linux.tar.gz" -C linux-package .
          rm -- artifacts/*-linux-*.AppImage
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "08 Codex RPC ${RELEASE_TAG#v}" --notes-file .github/release-notes.md
          fi

